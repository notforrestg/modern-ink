<!doctype html>
<html lang="en" style="background:#161616">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Modern Ink Color Map: GAME (Prototype) (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#161616;
  --field:#1f1f1f;
  --silver:#bbbdbf;
  --edge:rgba(255,255,255,.28);
  --text:#ffffff;
  --muted:#d2d2d2;
  --glow:0 0 10px rgba(255,255,255,.5),0 0 2px rgba(255,255,255,.55);
  --lift:-28px;
  --box:#2b2b2b;
  --boxtext:#f4f4f4;
  --line:#7d7d7d;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ground)}
body{
  margin:0;height:100%;background:var(--ground);color:var(--text);
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
#ground{position:fixed;inset:0;background:#161616;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;padding:12px 26px 14px 26px;display:flex;flex-direction:column}
/* embed fix v2: the v1 fix used width breakpoints (640px/900px), but inside a Circle iframe the viewport width IS the iframe's own box, which Circle
   sizes to its post width, not the device screen width -- so those breakpoints rarely fired (confirmed: still cramped on phone, desktop and most iPad
   views after v1 shipped). Below 480px-wide boxes, nothing changes from the original mobile layout. Above that, max-width switches to a fluid vw-based
   value (capped at 900px) so the card fills whatever box Circle hands it on any device, with no pixel-guessing needed. */
@media (min-width:481px){#app{max-width:min(900px,94vw)}}
.vert.r{left:auto;right:7px;transform:none}
.vert{position:absolute;left:7px;bottom:22px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.34);pointer-events:none}
@media (max-height:660px){.vert{display:none}}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.brandrow .kicker{margin:0}
.logo{display:block;height:26px;width:auto}
.logo.big{height:34px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

/* header */
.hd{flex:none}
.krow{display:flex;align-items:center;justify-content:space-between;min-height:26px;margin:0 0 4px}
.krow .kicker{margin:0}
.brandrow .rt{display:flex;align-items:center;gap:8px}
.pline{position:absolute;left:22px;right:22px;top:0;height:3px;background:rgba(255,255,255,.18);z-index:3}
.pline i{display:block;height:100%;width:0;background:#d4d3d1;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.pline.bump i{animation:bump .55s ease-out}
.hd .top{display:none}
.snd{flex:none;width:44px;height:32px;margin:-8px -12px -8px 0;background:none;border:0;padding:0;display:grid;place-items:center;cursor:pointer;color:#e6e6e6}
.snd svg{width:22px;height:22px}
.snd .x{display:none}
.snd.off .waves{display:none}
.snd.off .x{display:block}
.snd:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.progress{flex:1;height:3px;background:rgba(255,255,255,.18);margin:0}
.progress i{display:block;height:100%;width:0;background:#d4d3d1;transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 rgba(255,255,255,0)}
.progress.bump i{animation:bump .55s ease-out}
@keyframes bump{0%{box-shadow:0 0 0 rgba(255,255,255,0);filter:brightness(1)}30%{box-shadow:0 0 10px 1px rgba(255,255,255,.8);filter:brightness(1.5)}100%{box-shadow:0 0 0 rgba(255,255,255,0);filter:brightness(1)}}
.title{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.005em}
.title.glow{text-shadow:var(--glow)}
.kicker{margin:0 0 4px;font-size:12px;font-weight:500;color:#cfcfcf;letter-spacing:.26em;text-transform:uppercase}
.title.big{font-size:32px;line-height:1.08}
.title.big+.sub{font-size:16px;color:#e6e6e6;line-height:1.45}
.title.big.long{font-size:26px;line-height:1.14}
.hero{position:relative;--bl:22px;--bw:2px;--bk:#ececec;padding:18px 18px 16px;margin:4px 0 0}
.herot{margin:0;font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:clamp(32px,10.4vw,44px);line-height:.98;letter-spacing:.005em;text-transform:uppercase;text-shadow:0 0 14px rgba(255,255,255,.5),0 0 2px rgba(255,255,255,.5)}
.heros{margin:12px 0 0;font-size:11px;line-height:1.75;letter-spacing:.17em;text-transform:uppercase;font-weight:400;color:#bcbcbc}
.hd.enter .herot{animation:titleIn .75s cubic-bezier(.2,.8,.2,1) backwards .1s}
.hd.enter .heros{animation:fadeIn .6s ease-out backwards .5s}
.cap2{flex:none;margin:0;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#d6d6d6}
.sub.pulse{animation:subPulse .9s ease-out}
@keyframes subPulse{0%{text-shadow:0 0 0 rgba(255,255,255,0)}25%{text-shadow:0 0 12px rgba(255,255,255,.75);color:#fff}100%{text-shadow:0 0 0 rgba(255,255,255,0)}}
.hd.enter .kicker{animation:fadeIn .5s ease-out backwards}
.hd.enter .title{animation:titleIn .75s cubic-bezier(.2,.8,.2,1) backwards .1s}
.hd.enter .sub{animation:fadeIn .6s ease-out backwards .45s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes titleIn{from{opacity:0;letter-spacing:.07em;transform:translateY(8px)}to{opacity:1;letter-spacing:-.005em;transform:none}}
.sub{margin:6px 0 0;font-size:14.5px;line-height:1.45;font-weight:400;color:var(--muted);min-height:0}
.name{font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.03em;text-transform:uppercase}

/* corner brackets: thin L-shaped marks, no notches */
.panel::after,.tile::after,.pbox::after,.capname::after,.hero::after,.sub.instr::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(var(--bk),var(--bk)) top left/var(--bl) var(--bw) no-repeat,
    linear-gradient(var(--bk),var(--bk)) top left/var(--bw) var(--bl) no-repeat,
    linear-gradient(var(--bk),var(--bk)) top right/var(--bl) var(--bw) no-repeat,
    linear-gradient(var(--bk),var(--bk)) top right/var(--bw) var(--bl) no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom left/var(--bl) var(--bw) no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom left/var(--bw) var(--bl) no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom right/var(--bl) var(--bw) no-repeat,
    linear-gradient(var(--bk),var(--bk)) bottom right/var(--bw) var(--bl) no-repeat;
}
.panel{--bl:22px;--bw:2px;--bk:#ececec;position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--field)}
.panel>.inner{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px;transition:opacity .18s ease}
.panel>.inner.swap{opacity:0}

/* map */
.mapbox{position:relative;flex:1 1 0;min-height:0}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-height:600px){.mapbox.mini{display:none}}
.map{--gop:.15;overflow:visible}
.map.big{--gop:.24}
.map .grid line,.map .grid polygon{fill:none;stroke:#bbbdbf;stroke-width:2.2;opacity:var(--gop);stroke-dasharray:var(--len);stroke-dashoffset:0;transition:stroke-dashoffset .95s ease-out}
.map .shine line,.map .shine polygon{fill:none;stroke:#fff;stroke-width:2.6}
.map .dot{transform-box:fill-box;transform-origin:center;transition:opacity .35s ease,transform .4s cubic-bezier(.2,.8,.2,1),fill .32s ease,fill-opacity .32s ease,stroke .32s ease,stroke-opacity .32s ease,stroke-width .32s ease}
.map .dot.hide{opacity:0}
.map .dot.ghost{fill:rgba(0,0,0,0);stroke:#a8a8a8;stroke-opacity:.5;stroke-width:3.5}
.map .dot.ghost2{fill:rgba(0,0,0,0);stroke:#e9e9e9;stroke-opacity:.8;stroke-width:3.5}
.map .dot.fill{stroke:rgba(255,255,255,.4);stroke-width:3}
.map .dot.dim{stroke:rgba(255,255,255,.2);stroke-width:3;fill-opacity:.4}
.map .dot.sel{stroke:#fff;stroke-width:6}
.map .marker{fill:none;stroke:#fff;stroke-width:5}
.map .wedge{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.75);stroke-width:2.5;stroke-linejoin:round}
.map.zoom{overflow:hidden;--gop:.15}
.map.zoom .grid line,.map.zoom .grid polygon{stroke-width:1.5}
.map.zoom .dot.dim{fill-opacity:.3;stroke:rgba(255,255,255,.14)}
.map .lab{opacity:0;transition:opacity .45s ease}
.map .lab.show{opacity:1}
.map .ltext{font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.03em;fill:#f4f4f4}
.dmap{position:relative;width:100%;aspect-ratio:2.5/1;flex:none}
.dmap svg{position:absolute;inset:0;width:100%;height:100%}
.map .dot.pop{animation:dotPop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes dotPop{0%{transform:scale(2.2)}55%{transform:scale(.88)}100%{transform:scale(1)}}
.map .dot.flash{animation:dotFlash .75s ease-out backwards}
@keyframes dotFlash{0%,100%{stroke:rgba(255,255,255,.4);stroke-width:3}35%{stroke:#fff;stroke-width:9}}
.map .hit{fill:transparent;cursor:pointer}
.map .sweep{transform:translateX(0)}
.map.shimmer .sweep{animation:sweep 1.5s cubic-bezier(.45,0,.2,1) forwards}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1300px)}}
.map.stage .grid line,.map.stage .grid polygon{stroke-dashoffset:var(--len)}
.map.stage.drawn .grid line,.map.stage.drawn .grid polygon{stroke-dashoffset:0}
.map.stage .dot{opacity:0}
.map.stage .dot.fill{transform:scale(.4)}
.map.stage.drawn .dot.ghost{opacity:1}
.map.stage.lit .dot.fill{opacity:1;transform:none}
.map.instant *{transition:none!important;animation:none!important}

/* tiles */
.tiles{display:grid;gap:4px;flex:none}
.tiles.c2{grid-template-columns:1fr 1fr}
.tiles.c1{grid-template-columns:1fr}
.tile{
  --bl:9px;--bw:2px;--bk:rgba(255,255,255,.5);
  position:relative;height:var(--th,36px);padding:0;border:0;cursor:pointer;text-align:left;background:var(--box);color:var(--boxtext);
  transition:background .15s ease,transform .14s cubic-bezier(.2,.8,.2,1);
}
.tile .in{position:relative;z-index:1;height:100%;display:flex;align-items:center;gap:10px;padding:0 12px}
.tile .name{font-size:var(--ns,17px);color:var(--boxtext);line-height:1;white-space:nowrap;text-shadow:0 0 0 rgba(255,255,255,0);transition:text-shadow .6s ease}
.tiles>.tile{min-width:0}
.tiles.c2 .tile .in{padding:0 10px;gap:8px}
.chip{position:relative;flex:none;width:var(--chip,17px);height:var(--chip,17px);border-radius:50%;border:2px solid rgba(255,255,255,.42);transition:background .2s ease,border-color .2s ease}
.chip.on{border:3px solid var(--bd,#fff);animation:chipPop .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes chipPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.rip{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.tile.over,.tile.hint{background:#383838;--bk:#fff}
.tile.over{transform:scale(1.03)}
.tile.pop{animation:tilePop .38s cubic-bezier(.2,.9,.3,1.3)}
@keyframes tilePop{0%{transform:scale(1.06)}100%{transform:scale(1)}}
.tile.nope::after{animation:nopeBr .32s linear}
@keyframes nopeBr{0%,100%{opacity:1}25%,75%{opacity:.1}50%{opacity:1}}
.tile.over .name,.tile.hint .name,.tile.just .name{text-shadow:var(--glow);transition:none}
.tile.done{--bk:#fff;background:#323232}
.tile.off{opacity:.32;pointer-events:none}
.tile.off .chip{border-style:dashed}
.tile:focus-visible .in{outline:2px solid #fff;outline-offset:-5px}

/* note + tray */
.note{flex:none;margin:0;min-height:2.1em;font-size:14px;line-height:1.4;font-weight:500;color:#fff}
.note .name{font-size:14.5px;background:var(--box);color:var(--boxtext);padding:2px 7px 2px 6px;margin:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;white-space:nowrap}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--c);border:2px solid var(--bd,#fff);margin-right:6px;vertical-align:-1px}
.capname{position:relative;--bl:9px;--bw:2px;--bk:rgba(255,255,255,.6);display:inline-flex;align-items:center;gap:12px;font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:24px;line-height:1;color:var(--boxtext);background:var(--box);padding:11px 16px;text-shadow:var(--glow)}
.capname .sw{width:22px;height:22px;margin:0}
.note .glow{text-shadow:var(--glow)}
.foot .note{font-size:15px}
.tray{flex:none;position:relative;height:76px;display:flex;align-items:center;justify-content:center;gap:14px;border-top:1px solid var(--edge);padding-top:8px}
.puck{
  --s:64px;
  position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;padding:0;cursor:grab;
  background:var(--c);border:3px solid var(--bd,#fff);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.puck.arrive{animation:puckIn .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0ms)}
.puck.s{--s:54px}
.puck.xs{--s:50px}
.tray.wrap{height:auto;min-height:84px;flex-wrap:wrap;align-content:center;gap:10px 12px;padding-bottom:8px}
.puck{transition:filter .14s ease}
.puck.dragging{z-index:30;cursor:grabbing;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4))}
.puck.selected{outline:2px solid #fff;outline-offset:4px}
.puck:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes puckIn{0%{opacity:0;translate:0 34px}60%{opacity:1;translate:0 -7px}100%{opacity:1;translate:0 0}}

.wchip::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--bk),var(--bk)) top left/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) top left/var(--bw) var(--bl) no-repeat,linear-gradient(var(--bk),var(--bk)) top right/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) top right/var(--bw) var(--bl) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom left/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom left/var(--bw) var(--bl) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom right/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom right/var(--bw) var(--bl) no-repeat}
/* navigation */
.navc{display:flex;align-items:center;gap:6px}
.navc .kicker{margin:0 0 0 6px}
.krow2{margin:0 0 6px}
.nb{flex:none;width:34px;height:28px;padding:0;display:grid;place-items:center;border:2px solid var(--line);background:transparent;color:#f0f0f0;cursor:pointer;border-radius:0}
.nb svg{width:16px;height:16px}
.nb:disabled{opacity:.3;cursor:default}
.nb:focus-visible{outline:2px solid #fff;outline-offset:2px}
.brandrow{margin:0 0 8px}
/* celebration */
.sparks{position:absolute;inset:0;pointer-events:none;z-index:6}
.sp{position:absolute;width:var(--sz,14px);height:var(--sz,14px);margin:calc(var(--sz,14px) / -2) 0 0 calc(var(--sz,14px) / -2);background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px rgba(255,255,255,.9));opacity:0;animation:sparkle .95s ease-out both}
@keyframes sparkle{0%{opacity:0;transform:scale(0) rotate(0deg)}35%{opacity:1;transform:scale(1.25) rotate(35deg)}100%{opacity:0;transform:scale(.2) rotate(90deg)}}
.rescard{position:relative}
/* prominent instructions */
.sub.instr{position:relative;--bl:9px;--bw:2px;--bk:rgba(255,255,255,.65);margin:8px 0 0;padding:9px 13px;background:var(--box);color:#fff;font-size:18px;font-weight:600;line-height:1.25;min-height:0}
.sub.instr:empty{display:none}
.panel .sub.instr{margin:0;flex:none}
.note.coach{font-size:16px;font-weight:600;color:#fff}
.btn.lit{animation:litPulse 1.5s ease-in-out infinite}
@keyframes litPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.mapbox.qmap{flex:1 1 0;min-height:130px}
/* wheel board */
.mapbox.wheelbox{position:relative}
.tiles.wheel{position:absolute;inset:0;display:block;pointer-events:none;gap:0}
.tiles.wheel .tile{position:absolute;width:auto;height:26px;--bl:6px;pointer-events:auto}
.tiles.wheel .tile .in{padding:0 8px;gap:0}
.tiles.wheel .tile .chip{display:none}
.tiles.wheel .tile .name{font-size:14px}
/* last act */
.ladder.wide{gap:8px}
.ladder.wide .rung{height:50px;font-size:17px;padding:0 14px}
.rtag{margin-left:auto;font-style:normal;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.pastels{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;justify-content:space-between}
.mc.s{width:46px;height:46px;animation:mixPop .6s cubic-bezier(.2,1.4,.3,1) backwards;animation-delay:calc(var(--i) * 110ms + 300ms)}
.mc.s.pas{animation-delay:calc(var(--i) * 110ms + 1100ms)}
/* beyond the map */
.beyond1{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.beyond1 .mapbox{flex:1}
.inkgrid{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inkchip{animation:boxIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 110ms + 600ms)}
.inkchip .capname{display:flex;width:100%;font-size:15px}
.inkcards{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
.inkcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;animation:boxIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 160ms + 200ms)}
.inkcard .stoptxt{font-size:16px}
.inkcard .capname,.inkchip .capname{text-shadow:none}
.inkcard .sw,.inkchip .sw{flex:none;width:18px;height:18px}
.mixdemo{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--edge)}
.mixrow{display:flex;align-items:center;gap:12px}
.mc{display:block;width:52px;height:52px;border-radius:50%;background:var(--c);border:3px solid var(--bd)}
.mop{font-size:26px;font-weight:600;color:#d6d6d6}
.mixrow>*{opacity:0;animation:mixIn .5s ease-out forwards}
.mixrow>*:nth-child(1){animation-delay:.5s}.mixrow>*:nth-child(2){animation-delay:.8s}.mixrow>*:nth-child(3){animation-delay:1s}.mixrow>*:nth-child(4){animation-delay:1.35s}
.mixrow>.res{animation:mixPop .6s cubic-bezier(.2,1.4,.3,1) 1.7s forwards}
@keyframes mixIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mixPop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mixrow>*{animation:none;opacity:1}}
/* ladders */
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{display:flex;align-items:center;height:46px;padding:0 10px;background:var(--c);border:2px solid var(--bd);font-size:15px;font-weight:600;opacity:0;transform:translateX(-10px);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.rung.on{opacity:1;transform:none}
.introrow{flex:1;min-height:0;display:flex;gap:10px}
.introrow .ladder{flex:none;width:122px;justify-content:center}
.introrow .mapbox{flex:1;min-width:0}
.lwrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:6px 2px}
.lcols{display:flex;gap:10px;align-items:flex-start}
.lcols .ladder{flex:1 1 0;min-width:0}
@media (prefers-reduced-motion:reduce){.rung{transition:none}}
/* explainer cards */
.tiles.wheel .tile.static{pointer-events:none}
.mods{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:6px 2px}
.mgroup{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-wrap:wrap;gap:8px}
.mbox{position:relative;--bl:8px;--bw:2px;--bk:rgba(255,255,255,.55);background:var(--box);color:var(--boxtext);padding:13px 18px;font-weight:600;font-size:19px;line-height:1;animation:boxIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 80ms + 250ms)}
.mbox::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--bk),var(--bk)) top left/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) top left/var(--bw) var(--bl) no-repeat,linear-gradient(var(--bk),var(--bk)) top right/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) top right/var(--bw) var(--bl) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom left/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom left/var(--bw) var(--bl) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom right/var(--bl) var(--bw) no-repeat,linear-gradient(var(--bk),var(--bk)) bottom right/var(--bw) var(--bl) no-repeat}
/* walk stops */
.panel>.inner.stopping .tiles,.panel>.inner.stopping .note,.panel>.inner.stopping .tray{display:none}
.stopcard{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:4px 2px 0}
.stopcard .capname{align-self:flex-start}
.stoptxt{margin:0;font-size:17px;line-height:1.4;font-weight:500;color:#fff}
.stopcard .btn{margin-top:4px}

.qstage{transition:opacity .28s ease,transform .28s ease}

.qstage.entering{animation:qIn .42s cubic-bezier(.2,.8,.2,1)}

.tag{display:inline-block;margin-right:8px;padding:3px 7px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#141414;background:#f2f2f2;vertical-align:1px}
.tag.no{background:transparent;color:#f2f2f2;border:1.5px solid #f2f2f2;padding:1.5px 6px}
.qstage .note{min-height:3.6em;font-size:15px;line-height:1.4}
.qstage .note.ok{font-size:16px;font-weight:600;color:#fff}
.tick{flex:none;margin-left:auto;width:22px;height:22px;color:#fff}
.tick svg{width:22px;height:22px;display:block}
.wchip.lock{pointer-events:none;opacity:.9}
.tile.slot.nope::after{animation:nopeBr .4s linear}
/* quiz */
.qstage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.qcap{flex:none;margin:0;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#d6d6d6}
.qswatch{flex:1 1 0;min-height:90px;display:grid;place-items:center}
.qswatch i{display:block;width:min(36vw,132px);height:min(36vw,132px);border-radius:50%;background:var(--c);border:5px solid var(--bd,#fff)}
.tiles.q{--ns:21px;--th:48px}
.tiles.q .chip{display:none}

.tile.right{--bk:#fff;background:#3d3d3d}

.tile.wrong{opacity:.55}
.tile.dim{opacity:.4}
.slots{display:grid;gap:6px;flex:none}

.slot .in{display:flex;align-items:center;gap:12px;padding:0 12px;height:100%}
.snum{flex:none;width:22px;height:22px;border:2px solid rgba(255,255,255,.4);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#cfcfcf}
.slotword{flex:1;display:flex;align-items:center;min-height:36px}
.slotlab{flex:none;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#bdbdbd}
.tile.slot.over{background:#383838;--bk:#fff}
.tile.slot.right{--bk:#fff;background:#363636}
.tile.slot.wrong{opacity:.6}
.otray{flex:1;min-height:70px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;border-top:1px solid var(--edge);padding-top:6px}

.pbox{position:relative;--bl:9px;--bw:2px;--bk:rgba(255,255,255,.5);background:var(--box);color:var(--boxtext);padding:11px 14px;font-weight:600;font-size:16px;line-height:1;
  animation:boxIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 70ms + 400ms)}

function fitTiles(container,labels){
  var first=container.querySelector('.tile');if(!first||!labels.length)return;
  var tw=first.clientWidth;if(!tw)return;
  var c2=container.classList.contains('c2');
  var padX=c2?20:24,gap=c2?8:10;
  var w100=Math.max.apply(null,labels.map(function(l){return textW(l,100);}))/100;

  var th=Math.max(34,Math.min(37,Math.round(size*2.1)));

function ac(){

function silentWav(){
  var n=800,b=new Uint8Array(44+n);
  function w32(o,v){b[o]=v&255;b[o+1]=(v>>8)&255;b[o+2]=(v>>16)&255;b[o+3]=(v>>24)&255;}
  function w16(o,v){b[o]=v&255;b[o+1]=(v>>8)&255;}
  b.set([82,73,70,70],0);w32(4,36+n);b.set([87,65,86,69,102,109,116,32],8);w32(16,16);w16(20,1);w16(22,1);w32(24,8000);w32(28,8000);w16(32,1);w16(34,8);b.set([100,97,116,97],36);w32(40,n);
  for(var i=0;i<n;i++)b[44+i]=128;
  var s='';for(var j=0;j<b.length;j++)s+=String.fromCharCode(b[j]);

}
function unlockAudio(){

    var a=new Audio(silentWav());a.loop=true;a.volume=.02;a.setAttribute('playsinline','');
    var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});
  }catch(e){}
  try{var o=c.createOscillator(),g=c.createGain();g.gain.value=0;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.01);}catch(e){}
}

function tone(f,d,type,v,delay,f2){
  if(!soundOn)return;var c=ac();if(!c)return;
  var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function whoosh(d,v,f0,f1,delay){

  if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate);var a=noiseBuf.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1;}

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.35);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05);

var FLOW=['i1','e1','e2','e3','p1','q1','r1','i2','p2','q2','r2','i3','p3','q3','r3','i4','p4','q4','r4','b1','b2','b3','g1','g2','f1','f2','f3'];

function navEnter(k){nav.cur=k;nav.vis[k]=1;}

function navGo(k){
  if(!k)return;

  switch(k.charAt(0)){
    case 'i':showIntro(n);break;

    case 'q':showQuiz(n);break;
    case 'r':showReveal(n,{instant:true});break;

    case 'f':showFinal(n);break;
    case 's':showStub();break;
  }
}

function sevenRound(h){

    pucks:sh,

    spoke:STEPS7.map(function(s){return s+' '+h;}),
    good:function(p){

/* ---------- tutorial toolkit ---------- */
function mkChk(g){return function(){if(g!==gen)throw 'cancel';};}
function pwait(ms,chk){return new Promise(function(res,rej){setTimeout(function(){try{if(chk)chk();res();}catch(e){rej(e);}},ms);});}
function tween(elm,x,y,s,ms,chk){
  var from='translate('+(elm._x||0)+'px,'+(elm._y||0)+'px) scale('+(elm._s==null?1:elm._s)+')';
  var to='translate('+x+'px,'+y+'px) scale('+s+')';
  elm._x=x;elm._y=y;elm._s=s;
  if(elm._a){try{elm._a.cancel();}catch(e){}elm._a=null;}
  if(RM||!elm.animate||!ms){elm.style.transform=to;return Promise.resolve();}
  var a=elm.animate([{transform:from},{transform:to}],{duration:ms,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'});
  elm._a=a;
  return a.finished.then(function(){elm.style.transform=to;try{a.cancel();}catch(e){}if(elm._a===a)elm._a=null;if(chk)chk();},function(){});
}
function center(elm,root){var r=elm.getBoundingClientRect(),q=root.getBoundingClientRect();return {x:r.left+r.width/2-q.left,y:r.top+r.height/2-q.top};}

function makeDemo(root,g){

  };

  D.miss=async function(puck,tile){

  };
  D.drag=async function(puck,tile,idx){await D.grab(puck);await D.carry(puck,tile);await D.w(350);await D.drop(puck,tile,idx);await D.w(400);};
  D.tap=async function(puck,tile,idx){
    var pc=D.c(puck);f.at(pc);f.show();await D.w(250);
    f.down();await D.w(110);f.up();puck.classList.add('selected');SND.pick();await D.w(260);

  };
  return D;
}

/* each name sits directly above or below its own Vivid dot, so it is plain which name belongs to which color */
function wheelLayout(mb,list){
  var W=mb.clientWidth,H=mb.clientHeight;
  if(!W||!H)return false;
  var sc=Math.min(W/834,H/874),ox=(W-834*sc)/2,oy=(H-874*sc)/2;
  list.forEach(function(tl){
    var h=tl.dataset.key,a=HUES.indexOf(h)*36*Math.PI/180,n=byName.get('Vivid '+h);
    var px=ox+(n.cx-62)*sc,py=oy+(n.cy-66)*sc,w=tl.offsetWidth||64,hh=26;
    py+=(Math.cos(a)>0.05?-1:1)*(n.r*sc+hh/2+5);
    tl.style.left=Math.max(2,Math.min(W-w-2,px-w/2))+'px';
    tl.style.top=Math.max(2,Math.min(H-hh-2,py-hh/2))+'px';
  });
  return true;
}

    tweenView(map.svg,plan.view,900,function(){
      if(!alive()||tk!==flowTok)return;
      addLabels(map,nodes.map(function(x,k){var pl=plan.labels[k];return {node:x,text:x.toUpperCase(),left:pl.side==='left',center:!!pl.center,sx:pl.sx||0,cy:pl.cy,pad:plan.pad,lw:plan.u*1.5};}),plan.fs).forEach(function(l){l.classList.add('show');});
      map.flash(round.spoke.length?round.spoke:nodes);
      miniSparkle(mb,nodes.map(function(x){return relCenter(map.dots.get(x),mb);}));
      SND.ring(3);
    });
  }
  function afterPlace(){
    var tk=flowTok;
    if(round.kind==='seq'&&queue.length){
      setTimeout(function(){if(alive()&&tk===flowTok)nextPuck();},RM?300:1300);
      return;
    }
    if(pucks().length&&round.kind==='all')return;
    if(round.kind==='seq'&&pucks().length)return;
    buzz(HAP.round);SND.round();
    var hold;
    if(round.wheel){clearLit();map.mark(null);map.flash(round.pucks.map(function(q){return q.node;}));hold=2000;}
    else{roundWin(tk);hold=(round.finish?4600:3800);}
    if(RM)hold=Math.min(hold,1500);
    if(ri<rounds.length-1){
      setTimeout(function(){
        if(!alive()||tk!==flowTok)return;
        inner.classList.add('swap');
        setTimeout(function(){
          if(!alive()||tk!==flowTok)return;
          ri++;startRound();
          inner.classList.remove('swap');
        },RM?0:200);
      },hold);
    }else{
      setTimeout(function(){if(alive()&&tk===flowTok)showQuiz(n);},hold);
    }
  }
  /* jump to any round, for reviewing */
  function goRound(k){
    flowTok++;clearTimeout(nudgeT);stopCoach();coach=null;busy=false;
    ri=k;filled=new Set();placed=0;
    rounds.slice(0,k).forEach(function(r){r.pucks.forEach(function(q){filled.add(q.node);placed++;});});
    hd.progress(placed/total);
    inner.classList.remove('swap');
    startRound();
  }
  hd.nav({back:function(){if(ri>0)goRound(ri-1);else navGo(navPrev());},fwd:function(){if(ri<rounds.length-1)goRound(ri+1);else navGo(navNext());}});
}

/* ---------- start ---------- */
(function route(){
  if(location.hash==='#reset')save({done:[],seen:[]});
  var hm=/^#([1-4])$/.exec(location.hash||'');
  if(hm){showIntro(+hm[1]);return;}
  var hq=/^#q([1-4])$/.exec(location.hash||'');
  if(hq){showQuiz(+hq[1]);return;}
  var st=load();
  var nxt=[1,2,3,4].filter(function(k){return st.done.indexOf(k)<0;})[0];
  var hg=/^#g([1-2])$/.exec(location.hash||'');
  if(hg){showGrays(+hg[1]);return;}
  var hf=/^#f([1-3])$/.exec(location.hash||'');
  if(hf){showFinal(+hf[1]);return;}
  var hb=/^#b([1-3])$/.exec(location.hash||'');
  if(hb){showBeyond(+hb[1]);return;}
  if(nxt)showIntro(nxt);else showBeyond(1);
})();
window.__miZoomPlan=zoomPlan;

})();
</script>
